name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm run upstream:materialize
      - run: npm run upstream:verify

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.40.0
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool x11-utils libsdl2-dev libfreetype6-dev
      - run: npm ci
      - run: npm run m2:parameter:ci
      - run: npm run creator:materialize
      - run: npm run creator:fixture
      - name: Prove minimal public-core puppet opens in official Creator
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/creator-roundtrip-base.inp
      - name: Prove hierarchy-only puppet opens in official Creator
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/creator-roundtrip-hierarchy.inp
      - name: Prove texture-only puppet opens in official Creator
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/creator-roundtrip-texture.inp
      - name: Prove Part visual puppet opens in official Creator
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/creator-roundtrip-visual.inp
      - name: Prove unbound-parameter puppet opens in official Creator
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/creator-roundtrip-parameters.inp
      - name: Prove fully-bound puppet opens in official Creator
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/creator-roundtrip-input.inp
      - run: npm run creator:roundtrip
      - run: npm run creator:verify
