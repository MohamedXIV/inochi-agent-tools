name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm run upstream:materialize
      - run: npm run upstream:verify

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.40.0
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool x11-utils libsdl2-dev libfreetype6-dev
      - run: npm ci
      - run: npm run m3:cli:ci
