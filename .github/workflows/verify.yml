name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm run upstream:materialize
      - run: npm run upstream:verify

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.40.0
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool x11-utils libsdl2-dev libfreetype6-dev
      - run: npm ci
      - name: Materialize pinned upstream
        run: npm run upstream:materialize
      - name: Verify pinned upstream
        run: npm run upstream:verify
      - name: Verify native toolchain
        run: npm run native:toolchain:verify
      - name: Build native bridge
        run: npm run native:build
      - name: Probe native bridge
        run: npm run native:probe
      - name: v1 MCP/CLI acceptance
        run: npm run m3:mcp:ci
      - name: Build v1 agent artifacts
        run: npm run v1:artifacts
      - name: Materialize Creator
        run: npm run creator:materialize
      - name: Creator-open v1 CLI artifact
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/v1-cli-authored.inp
      - name: Creator-open v1 MCP artifact
        run: node scripts/creator/launch-roundtrip.mjs --open-only tests/fixtures/generated/v1-mcp-authored.inp
      - name: Verify v1 artifacts
        run: npm run v1:verify-artifacts
      - name: Verify upstream fingerprint
        run: npm run upstream:fingerprint -- --json
      - name: Build v1.1 bundle
        run: npm run v1.1:bundle
      - name: Smoke packaged bundle
        run: node scripts/package/smoke-bundle.mjs
      - name: v1.2 rig primitives acceptance
        run: npm run v1.2:rig-primitives:ci
      - name: v1.3 visual controls acceptance
        run: npm run v1.3:visual-controls:ci
      - name: v1.4 headless preview acceptance
        run: npm run v1.4:preview:ci
