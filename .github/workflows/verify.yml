name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify
      - run: npm run upstream:materialize
      - run: npm run upstream:verify
